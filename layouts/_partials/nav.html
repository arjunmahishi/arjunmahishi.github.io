{{ $isHome := eq .Kind "home" }}
{{ $isPost := eq .Type "posts" }}
<header class="container-main site-header{{ if $isHome }} site-header-home{{ end }}">
  {{ if $isHome }}
    <h1><a href="{{ "" | relURL }}" class="site-name" lang="kn">ಅರ್ಜುನ್ ಮಹಿಷಿ</a></h1>
  {{ else }}
    <a href="{{ "" | relURL }}" class="site-name" lang="kn">ಅರ್ಜುನ್ ಮಹಿಷಿ</a>
  {{ end }}
  <nav aria-label="Main navigation">
    <ul>
      <li><a href="{{ "" | relURL }}#writing"{{ if or $isHome $isPost }} aria-current="location"{{ end }}>Writing</a></li>
      <li><a href="{{ "tabs/" | relURL }}"{{ if hasPrefix .RelPermalink "/tabs" }} aria-current="location"{{ end }}>Guitar Tabs</a></li>
      <li><a href="{{ "maps/" | relURL }}"{{ if hasPrefix .RelPermalink "/maps" }} aria-current="location"{{ end }}>Maps</a></li>
    </ul>
  </nav>
  {{ if $isHome }}
    <img
      src="{{ "img/dp.webp" | relURL }}"
      alt="Illustrated portrait of Arjun Mahishi at his laptop"
      width="180"
      height="150"
      class="home-portrait" />
  {{ end }}
</header>
