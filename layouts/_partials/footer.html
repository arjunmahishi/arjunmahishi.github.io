<footer class="container-main site-footer">
  <p>Elsewhere on the internet <span aria-hidden="true">↗</span></p>
  <ul aria-label="Social links">
    <li>{{ partial "rss-link" . }}</li>
    {{ range site.Data.social.links }}
      <li><a class="flex" href="{{ .url }}"><img src="{{ printf "img/%s.svg" .type | relURL }}" alt="{{ .type }}" width="20" height="20" /></a></li>
    {{ end }}
  </ul>
</footer>
