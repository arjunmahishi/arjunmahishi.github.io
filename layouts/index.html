{{ define "main" }}
  {{ partial "nav" . }}

  <main id="main-content" class="container-main" tabindex="-1">
    <section
      aria-label="About me"
      class="prose mb-12"
    >{{ .Content }}</section>

    <section id="writing" aria-labelledby="writing-heading">
      <div class="section-heading">
        <div class="flex items-center gap-3">
          <h2 id="writing-heading">Writing</h2>
          {{ partial "rss-link" . }}
        </div>
        <span>Software &amp; other interests</span>
      </div>
      {{ partial "post-list" . }}
    </section>
  </main>
{{ end }}
